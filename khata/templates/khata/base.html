<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OkCredit{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
                {{ request.user.shopprofile.shop_name|default:"Web Automation With Excel" }}
            </a>

            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                <span class="navbar-text text-white me-3 fw-semibold">Welcome, {{ user.username }}</span>
                <form action="{% url 'logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <a href="{% url 'shop_profile' %}" class="btn btn-outline-light btn-sm me-2">⚙️ Settings</a>
                    <button type="submit" class="btn btn-danger btn-sm">Logout</button>
                </form>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    {% if messages %}
    <div id="django-messages" style="display: none;">
        {% for message in messages %}
        <span class="d-msg" data-tag="{{ message.tags }}" data-text="{{ message }}"></span>
        {% endfor %}
    </div>
    {% endif %}

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Hidden messages ko dhoondhein
            const msgElements = document.querySelectorAll('.d-msg');

            msgElements.forEach(function (elem) {
                let msgText = elem.getAttribute('data-text');
                let msgTag = elem.getAttribute('data-tag');

                // Icon decide karein
                let iconType = "info";
                if (msgTag.includes("error")) { iconType = "error"; }
                else if (msgTag.includes("warning")) { iconType = "warning"; }
                else if (msgTag.includes("success")) { iconType = "success"; }

                // Toast notification setup
                const Toast = Swal.mixin({
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 3000,
                    timerProgressBar: true,
                    didOpen: (toast) => {
                        toast.onmouseenter = Swal.stopTimer;
                        toast.onmouseleave = Swal.resumeTimer;
                    }
                });

                Toast.fire({
                    icon: iconType,
                    title: msgText
                });
            });
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const deleteForms = document.querySelectorAll('.delete-form');

            deleteForms.forEach(form => {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();

                    Swal.fire({
                        title: 'Kya aap sure hain?',
                        text: "Yeh data hamesha ke liye delete ho jayega!",
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#dc3545',
                        cancelButtonColor: '#6c757d',
                        confirmButtonText: 'Haan, Delete karein!',
                        cancelButtonText: 'Cancel'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            form.submit();
                        }
                    });
                });
            });
        });
    </script>
</body>

</html>
</body>

</html>
